[package]
name = "mod-create"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The launcher points this at the Horizon source it builds the game from. Any other
# dependency must be a crate and version in Horizon's Cargo.lock.
horizon-client = { git = "https://github.com/horizon-rust/horizon" }
# The bundle's own `[[crate]]` (horizon-mixin.toml).
create-kinetics = { path = "../kinetics" }
serde = { version = "1", features = ["derive"] }
# Gzip for the schematic files: Horizon's own crate and features (its Cargo.lock has them).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
